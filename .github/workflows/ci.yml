# Continuous integration: daemon on all six target platforms, macOS plugin/package, Python tools.
# Daemon network tests use the loopback interface (local multicast).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    name: daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15          # Apple Silicon
          - macos-15-intel    # Intel
          - ubuntu-24.04      # x86_64
          - ubuntu-24.04-arm  # ARM64
          - windows-2025      # x64 (MSVC)
          - windows-11-arm    # ARM64 (MSVC)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: PipeWire development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev clang pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --no-fail-fast
      - name: Build release
        run: cargo build --release -p lw-daemon

  windows-driver:
    name: Windows driver (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ASIO SDK (steinberg.net, verified hash)
        run: powershell -ExecutionPolicy Bypass -File windows/driver/fetch-sdk.ps1
      - name: Driver and test host (MSVC)
        run: |
          cmake -S windows/driver -B build/driver -A ${{ matrix.arch }}
          cmake --build build/driver --config Release
      - name: Internal-loopback service and driver test
        shell: pwsh
        run: |
          cargo build --release -p lw-daemon --manifest-path daemon/Cargo.toml
          $cfg = Join-Path $env:RUNNER_TEMP "cfg.json"
          '{"iface":"auto","advertise":false,"device":{"channels_to_net":2,"channels_from_net":2,"loopback":true}}' | Set-Content -Encoding ascii $cfg
          $d = Start-Process daemon\target\release\lw-daemon.exe -ArgumentList "run","--config",$cfg,"--control" -PassThru -NoNewWindow
          Start-Sleep 3
          build\driver\Release\openlw-driver-test.exe "$PWD\build\driver\Release\OpenLWDriver.dll"
          $code = $LASTEXITCODE
          Stop-Process $d
          exit $code

  linux-pipewire:
    name: PipeWire nodes (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Daemon with PipeWire in a container (retry, audio loopback, reconnection)
        run: PLATFORM=${{ matrix.platform }} tools/ci/test-pipewire.sh

  macos-bundle:
    name: macOS plugin, app, and package
    runs-on: macos-26   # macOS 26 SDK (NSGlassEffectView)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: HAL plugin harness
        run: make -C macos/plugin test
      - name: Universal binaries and package
        run: |
          macos/scripts/build-all.sh
          macos/installer/build-pkg.sh

  tools:
    name: Python tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/lw/tests
