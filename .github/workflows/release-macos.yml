# macOS release: Developer ID signing, notarization, stapling (macos/scripts/release.sh), one package
# for Apple Silicon (arm64) and one for Intel (x86_64), both cross-built on this Apple Silicon runner.
# Runs on a version tag (vX.Y.Z, matching macos/app/Info.plist) or by hand. By hand: CI artifact
# only. On a tag: the "publish" job also attaches both packages and their SHA-256 sums to the
# GitHub release of that tag (pre-release for 0.x versions and tags with a suffix, such as
# v1.0.0-beta.1), with generated notes. The publishing job holds no signing secret.
#
# Secrets live in the "release" environment (add required reviewers to gate every run):
#   MACOS_APP_CERT_P12        base64 of the "Developer ID Application" .p12 (certificate + key)
#   MACOS_INSTALLER_CERT_P12  base64 of the "Developer ID Installer" .p12
#   MACOS_CERT_PASSWORD       password of both .p12 files
#   NOTARY_KEY_P8             base64 of the App Store Connect API key (.p8, "Developer" role)
#   NOTARY_KEY_ID             key ID
#   NOTARY_ISSUER_ID          issuer ID (team key only; leave unset for an individual key)
# Third-party code is kept out of this job (no rust-toolchain action), actions are pinned by commit.
name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed and notarized package
    runs-on: macos-26   # macOS 26 SDK (NSGlassEffectView)
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" macos/app/Info.plist)
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match app version $version"
            exit 1
          fi

      - name: Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: HAL plugin harness
        run: make -C macos/plugin test

      - name: Temporary keychain
        env:
          APP_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kc_password=$(openssl rand -base64 32)
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 5400 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          umask 077
          printf '%s' "$APP_P12" | base64 --decode >"$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode >"$RUNNER_TEMP/installer.p12"
          for p12 in "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"; do
            security import "$p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          done
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$kc" >/dev/null
          # Keychain search list: temporary keychain first (codesign --timestamp looks up the chain).
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode >"$RUNNER_TEMP/notary.p8"
          echo "KEYCHAIN=$kc" >>"$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: NOTARY_KEY="$RUNNER_TEMP/notary.p8" macos/scripts/release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openlw-macos-${{ github.ref_name }}
          path: |
            build/OpenLW-*.pkg
            build/OpenLW-*.pkg.sha256
          if-no-files-found: error

      - name: Notarization log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: notary-log-${{ github.ref_name }}
          path: build/notary-*.json
          if-no-files-found: ignore

      - name: Remove keychain and key
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

  publish:
    name: GitHub release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openlw-macos-${{ github.ref_name }}
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          (cd dist && sha256sum -c ./*.sha256)
          flags=""
          case "$TAG" in v0.*|*-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "OpenLW ${TAG#v}" --generate-notes $flags
          fi
