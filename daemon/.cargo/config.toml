# Minimum OS: 10.13 on x86_64; arm64 slices require at least 11.0 anyway.
[env]
MACOSX_DEPLOYMENT_TARGET = "10.13"

# Windows: static C runtime, so the service runs without the Visual C++ Redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
