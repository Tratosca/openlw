[package]
name = "lw-daemon"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
if-addrs = "0.15.0"
lw-proto = { version = "0.5.0", path = "../lw-proto" }
lw-sys = { version = "0.5.0", path = "../lw-sys" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }

[features]
default = ["pipewire"]
# Linux: device PipeWire nodes (build: libpipewire-0.3-dev, clang).
pipewire = ["dep:lw-pw"]

[target.'cfg(target_os = "linux")'.dependencies]
lw-pw = { version = "0.5.0", path = "../lw-pw", optional = true }

[lints]
workspace = true

# Linux packages (linux/packaging/build-packages.sh): service and PipeWire nodes, without GUI.
[package.metadata.deb]
name = "openlw-daemon"
maintainer = "François Brille"
copyright = "2026 François Brille"
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
extended-description = """\
OpenLW user service: connects the computer to a Livewire-compatible or AES67 audio \
network and publishes the "OpenLW In" and "OpenLW Out" PipeWire devices. \
The settings app is in the openlw package."""
depends = "$auto, pipewire, systemd"
recommends = "wireplumber"
assets = [
    ["target/release/lw-daemon", "usr/bin/", "755"],
    ["../../linux/packaging/openlw.service", "usr/lib/systemd/user/", "644"],
    ["../README.md", "usr/share/doc/openlw-daemon/README.md", "644"],
]
maintainer-scripts = "../../linux/packaging/deb/openlw-daemon/"

[package.metadata.generate-rpm]
name = "openlw-daemon"
summary = "OpenLW service: Livewire and AES67 audio for PipeWire"
license = "Apache-2.0"
assets = [
    { source = "target/release/lw-daemon", dest = "/usr/bin/lw-daemon", mode = "755" },
    { source = "../../linux/packaging/openlw.service", dest = "/usr/lib/systemd/user/openlw.service", mode = "644" },
    { source = "../README.md", dest = "/usr/share/doc/openlw-daemon/README.md", mode = "644", doc = true },
]
# User service enabled for every user at their next login; disabled on removal.
post_install_script = "systemctl --global enable openlw.service >/dev/null 2>&1 || :"
pre_uninstall_script = "if [ \"$1\" -eq 0 ]; then systemctl --global disable openlw.service >/dev/null 2>&1 || :; fi"

[package.metadata.generate-rpm.requires]
pipewire = "*"
systemd = "*"
