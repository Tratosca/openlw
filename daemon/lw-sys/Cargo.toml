[package]
name = "lw-sys"
version = "0.5.0"
description = "Daemon system layer (macOS, Linux, Windows): real-time scheduling, host clock, logging, shared region, control channel. The only workspace crate with unsafe code (FFI boundary)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

# No `[lints] workspace = true`: workspace forbids `unsafe`, required here at the C boundary.
# Every unsafe block has a SAFETY justification comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
serde_json = "1.0.151"
windows-service = "0.8"

[dev-dependencies]
serde_json = "1.0.151"

[build-dependencies]
cc = "1.6.0"
